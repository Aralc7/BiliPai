name: Build Personal APK

on:
  workflow_dispatch:
  push:
    branches:
      - personal

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Checkout Miuix source
        uses: actions/checkout@v4
        with:
          repository: compose-miuix-ui/miuix
          ref: f3829d3d162eb267a792d43b3c8541e64effc28d
          path: miuix

      - name: Patch Miuix Gradle feature previews
        run: sed -E -i '/NO_IMPLICIT_LOOKUP_IN_PARENT_PROJECTS|ENHANCED_GRAPH_ORDERING/d' miuix/settings.gradle.kts

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build dev APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew :app:assembleDev -Pbili.miuix.source="$GITHUB_WORKSPACE/miuix" --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPai-personal-dev
          path: app/build/outputs/bilipai/dev/*.apk
          if-no-files-found: error
          retention-days: 30
